<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <g fill="#06B6D4" opacity="0.25">
    <!-- Cloud shape -->
    <ellipse cx="300" cy="140" rx="50" ry="35"/>
    <ellipse cx="350" cy="130" rx="45" ry="40"/>
    <ellipse cx="400" cy="145" rx="48" ry="38"/>
    <rect x="250" y="140" width="200" height="40"/>

    <!-- Function blocks -->
    <rect x="280" y="220" width="70" height="50" rx="6"/>
    <rect x="370" y="220" width="70" height="50" rx="6"/>
    <rect x="325" y="290" width="70" height="50" rx="6"/>

    <!-- Lambda symbols -->
    <text x="305" y="252" font-family="monospace" font-size="28" fill="#06B6D4" opacity="0.6">λ</text>
    <text x="395" y="252" font-family="monospace" font-size="28" fill="#06B6D4" opacity="0.6">λ</text>
    <text x="350" y="322" font-family="monospace" font-size="28" fill="#06B6D4" opacity="0.6">λ</text>
  </g>
  <circle cx="680" cy="90" r="45" fill="#06B6D4" opacity="0.12"/>
  <circle cx="120" cy="330" r="60" fill="#06B6D4" opacity="0.08"/>
</svg>
